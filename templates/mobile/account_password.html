{% extends 'mobile/base.html' %}
{% block title %}Change password - {{ g.company.name }}{% endblock %}
{% block heading %}Change password{% endblock %}
{% block content %}
<form method="post" class="m-form" novalidate>
  <div class="m-field">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password">
  </div>
  <div class="m-field">
    <label for="password1">New password</label>
    <input id="password1" name="password1" type="password" autocomplete="new-password">
  </div>
  <div class="m-field">
    <label for="password2">Confirm new password</label>
    <input id="password2" name="password2" type="password" autocomplete="new-password">
  </div>
  <button class="m-btn m-btn-primary m-btn-block">Change password</button>
  <a class="m-btn m-btn-ghost m-btn-block" href="{{ url_for('mobile.account') }}">Cancel</a>
</form>
{% endblock %}
